# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
design:
  theme: sb2nov
  page:
    size: us-letter
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.5in
    right_margin: 0.5in
    show_footer: false
    show_top_note: false
  colors:
    name: rgb(38, 66, 139)
    headline: rgb(38, 66, 139)
    section_titles: rgb(38, 66, 139)
    links: rgb(38, 66, 139)
    body: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
  typography:
    font_family:
      body: New Computer Modern
      name: New Computer Modern
      headline: New Computer Modern
      connections: New Computer Modern
      section_titles: New Computer Modern
    font_size:
      body: 10pt
      name: 22pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.25em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: true
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  links:
    underline: true
    show_external_link_icon: false
  header:
    alignment: left
    space_below_name: 0.25cm
    space_below_headline: 0.25cm
    space_below_connections: 0.25cm
    connections:
      separator: "|"
      show_icons: false
      display_urls_instead_of_usernames: true
      space_between_connections: 0.4cm
  section_titles:
    type: with_full_line
    line_thickness: 1pt
    space_above: 0.45cm
    space_below: 0.25cm
  sections:
    space_between_regular_entries: 0.35cm
    space_between_text_based_entries: 0.15cm
    show_time_spans_in: []
  entries:
    side_space: 0cm
    date_and_location_width: 4.15cm
    space_between_columns: 0.1cm
    short_second_row: false
    highlights:
      bullet: "•"
      space_left: 0.2cm
      space_above: 0.05cm
      space_between_items: 0.05cm
      space_between_bullet_and_text: 0.4em
